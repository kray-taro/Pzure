# DOCS-branch CI. Keeps the documentation source of truth DRY, consistent and
# renderable. (The develop branch has its own .gitlab-ci.yml with code gates;
# these two root configs must never be merged across branches.)
#
# A workflow block is required: without it a job with no rules yields an empty
# merge_request_event pipeline that fails at creation (duration: null, no jobs).
# Run for MRs targeting DOCS and for pushes to DOCS.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "DOCS"'
    - if: '$CI_COMMIT_BRANCH == "DOCS"'

stages:
  - guard
  - consistency
  - lint

# --- guard stage: DRY/hygiene invariants (one ADR per number, no archives, .md only)

docs-hygiene:
  stage: guard
  image: alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "DOCS"'
    - if: '$CI_COMMIT_BRANCH == "DOCS"'
  script:
    - apk add --no-cache bash git grep sed coreutils >/dev/null
    - bash scripts/check-docs-hygiene.sh

# --- consistency stage: fast-failing policy checks ---------------------------

dr-consistency:
  stage: consistency
  image: alpine:3.20
  script:
    - apk add --no-cache bash grep >/dev/null
    - bash scripts/check-dr-consistency.sh

link-check:
  stage: consistency
  image: alpine:3.20
  script:
    - apk add --no-cache bash grep coreutils >/dev/null
    - bash scripts/check-docs-links.sh

# --- lint stage --------------------------------------------------------------

# Lint the WHOLE DOCS markdown tree and BLOCK on any violation.
# Rule set: .markdownlint.jsonc; file globs/ignores: .markdownlint-cli2.jsonc.
markdownlint:
  stage: lint
  image: node:20-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "DOCS"'
    - if: '$CI_COMMIT_BRANCH == "DOCS"'
  script:
    - npx --yes markdownlint-cli2@0.13.0 "**/*.md"
