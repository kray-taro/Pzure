# Pzure CI. One root pipeline for the repository (single source of truth).
# Mandatory gates before merge: policy guards, lint, type-check, unit tests,
# integration tests, and security scanning. No secrets in code (COMPLIANCE.md);
# configuration is environment-based. Nothing here deploys to or targets main.
#
# This file reconciles develop's DevSecOps guard gates (#13) with the Phase 1
# install/test/security stages so the two pipelines no longer collide on merge
# (refs #63, #64).

# Run one pipeline per change: a merge-request pipeline when an MR is open,
# otherwise a branch pipeline.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - guard
  - install
  - quality
  - test
  - security

variables:
  # Ephemeral runners gain nothing from the Nx daemon or a cross-machine local
  # cache; the latter makes Nx fail with "Invalid Cache Directory".
  NX_DAEMON: "false"

default:
  image: node:20
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/

# --- guard stage: cheap, fast-failing policy checks (from #13) ----------------

branch-name:
  stage: guard
  image: alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
  script:
    - apk add --no-cache bash >/dev/null
    - bash scripts/check-branch-name.sh "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"

no-raw-hex:
  stage: guard
  image: alpine:3.20
  script:
    - apk add --no-cache bash grep >/dev/null
    - bash scripts/check-no-raw-hex.sh

secret-detection-guard:
  stage: guard
  image: alpine:3.20
  script:
    - apk add --no-cache bash grep >/dev/null
    - bash scripts/check-no-secrets.sh

# --- install / quality / test ------------------------------------------------

install:
  stage: install
  script:
    # Interim: `npm install` until a generated package-lock.json is committed,
    # at which point this reverts to `npm ci` for reproducible installs.
    - npm install
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

lint:
  stage: quality
  needs: [install]
  script:
    - npm run lint

typecheck:
  stage: quality
  needs: [install]
  script:
    - npm run typecheck

unit-tests:
  stage: test
  needs: [install]
  script:
    - npm run test

integration-tests:
  stage: test
  needs: [install]
  # Allowed to fail until real integration tests exist AND the project-level
  # CI_MSSQL_SA_PASSWORD variable is configured. The infrastructure package has
  # no *.integration.spec.ts yet, so this gate is informational in Phase 1.
  allow_failure: true
  services:
    - name: mcr.microsoft.com/mssql/server:2022-latest
      alias: sqlserver
    - name: redis:7
      alias: redis-cache
  variables:
    ACCEPT_EULA: "Y"
    # Required masked CI variable. No fallback: secrets are never committed
    # (COMPLIANCE.md). If unset, the mssql service fails to start and this
    # allow_failure job is skipped/red without leaking a credential.
    MSSQL_SA_PASSWORD: "$CI_MSSQL_SA_PASSWORD"
    DB_HOST: sqlserver
    REDIS_URL: redis://redis-cache:6379
  script:
    # Seed a disposable DB (baseline migration), run integration tests, tear down.
    # No shared mutable state between runs.
    - npm run test:integration

# --- security gates (GitLab-managed templates) -------------------------------

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

sast:
  stage: security

dependency_scanning:
  stage: security

secret_detection:
  stage: security
