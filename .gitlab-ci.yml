# Pzure CI - DevSecOps foundation (#13)
#
# Design goals (Designing Data-Intensive Applications - Reliability,
# Scalability, Maintainability):
# - Reliability: every correctness invariant is a required, automated gate; a
#   red pipeline blocks merge. No invariant relies on human/agent discipline.
# - Maintainability: stages are small, single-responsibility and cacheable;
#   failures point at one cause.
# - Scalability: jobs are independent and run in parallel; the matrix grows by
#   adding packages, not by rewriting the pipeline.
#
# SOLID/DRY: tokens.json is the single source of truth (DRY). The drift test
# enforces it. The raw-hex guard enforces Dependency Inversion: components
# depend on the semantic token abstraction, never on primitive hex.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - guard
  - lint
  - typecheck
  - test
  - scan

# Gate 0B (#55): full SAST + dependency scanning + secret detection replace the
# day-one secret guard's "baseline only" scope. The local guard stays as a cheap
# fast-fail in the `guard` stage; these templates add deep static analysis and
# CVE checks. The templates contribute their own jobs; SAST uses language-
# specific analyzer jobs (no single top-level `sast` job), so we must NOT
# override `sast` - that was the earlier "CI/CD configuration file" error.
include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

default:
  image: node:20-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - corepack enable || true
    - if [ -f package-lock.json ]; then npm ci --cache .npm --prefer-offline || npm install; else npm install; fi

# --- guard stage: cheap, fast-failing policy checks ---------------------------

branch-name:
  stage: guard
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
  before_script: []
  image: alpine:3.20
  script:
    - apk add --no-cache bash >/dev/null
    - bash scripts/check-branch-name.sh "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"

no-raw-hex:
  stage: guard
  before_script: []
  image: alpine:3.20
  script:
    - apk add --no-cache bash grep >/dev/null
    - bash scripts/check-no-raw-hex.sh

secret-detection:
  stage: guard
  before_script: []
  image: alpine:3.20
  script:
    - apk add --no-cache bash grep >/dev/null
    - bash scripts/check-no-secrets.sh

# --- lint / typecheck / test -------------------------------------------------

lint:
  stage: lint
  script:
    - npm run lint

typecheck:
  stage: typecheck
  script:
    - npm run typecheck

test:
  stage: test
  script:
    - npm test
  coverage: '/All files[^|]*\|[^|]*\s+([\d.]+)/'

# Operability: these scans are heavy (Docker executor, minutes per run), so we
# scope them to develop, scheduled pipelines, and MRs targeting develop - the
# cheap guard-stage checks stay the per-MR fast-fail so MR velocity is kept.
# We override ONLY the real, named template jobs (dependency scanning + secret
# detection) for stage placement and scoping; SAST keeps its own analyzer jobs
# and default rules so we do not couple to template internals.
.scan-rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'

# The scanner jobs run in GitLab's managed scanner images, which have no
# node/npm. They must NOT inherit the project-wide default.before_script
# (`corepack`/`npm ci`) - that fails with exit 127 before the scanner runs.
# Neutralise before_script/after_script and the npm cache so each job uses only
# its scanner image's own entrypoint.
gemnasium-dependency_scanning:
  stage: scan
  cache: {}
  before_script: []
  after_script: []
  rules: !reference [.scan-rules, rules]

secret_detection:
  stage: scan
  cache: {}
  before_script: []
  after_script: []
  rules: !reference [.scan-rules, rules]

