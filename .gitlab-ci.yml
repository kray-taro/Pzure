# DOCS-branch CI. Keeps the documentation source of truth DRY and renderable.
# (The develop branch has its own .gitlab-ci.yml with code gates.)
#
# A workflow block is required: without it the only job has no rules, so a
# merge_request_event pipeline is created empty and fails at creation
# (duration: null, no jobs). Run for MRs and for pushes to DOCS.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "DOCS"'

stages:
  - guard

docs-hygiene:
  stage: guard
  image: alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "DOCS"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "DOCS"'
  script:
    - apk add --no-cache bash git grep sed coreutils >/dev/null
    - bash scripts/check-docs-hygiene.sh
