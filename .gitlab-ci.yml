# Pzure DOCS branch CI - documentation verification loop (#56)
#
# DDIA reliability: documentation invariants (consistent DR targets, valid
# links, lintable markdown) are machine-checked gates, not human discipline.
# This pipeline runs on the DOCS branch and on MRs targeting DOCS.

stages:
  - consistency
  - lint

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "DOCS"'
    - if: '$CI_COMMIT_BRANCH == "DOCS"'

# --- consistency stage: fast-failing policy checks ---------------------------

dr-consistency:
  stage: consistency
  image: alpine:3.20
  script:
    - apk add --no-cache bash grep >/dev/null
    - bash scripts/check-dr-consistency.sh

link-check:
  stage: consistency
  image: alpine:3.20
  script:
    - apk add --no-cache bash grep coreutils >/dev/null
    - bash scripts/check-docs-links.sh

# --- lint stage --------------------------------------------------------------

# Lint the WHOLE DOCS markdown tree and BLOCK on any violation.
# The legacy corpus has been burned down (#68): ADRs, WORK-ITEMS, and the
# module specs are all clean, and the module MD025 file-scoping exclusion has
# been removed from .markdownlint-cli2.jsonc. This is the final #68 step -
# full-tree blocking with no rule disabled. Rule set: .markdownlint.jsonc;
# file globs/ignores: .markdownlint-cli2.jsonc.
markdownlint:
  stage: lint
  image: node:20-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "DOCS"'
    - if: '$CI_COMMIT_BRANCH == "DOCS"'
  script:
    - npx --yes markdownlint-cli2@0.13.0 "**/*.md"
