# Pzure CI. Mandatory gates before merge: lint, unit tests, integration tests,
# and security scanning must all pass. No secrets in code (COMPLIANCE.md);
# configuration is environment-based. Nothing here deploys to or targets main.

# Run one pipeline per change: a merge-request pipeline when an MR is open,
# otherwise a branch pipeline. Prevents the empty/failed MR pipeline seen on
# MR !1 (no workflow rules meant custom jobs had no merge_request_event rule).
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - install
  - quality
  - test
  - security

variables:
  # Ephemeral runners gain nothing from the Nx daemon or a cross-machine local
  # cache; the latter makes Nx fail with "Invalid Cache Directory".
  NX_DAEMON: "false"

default:
  image: node:20
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/

install:
  stage: install
  script:
    # Interim: `npm install` until a generated package-lock.json is committed,
    # at which point this reverts to `npm ci` for reproducible installs.
    - npm install
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

lint:
  stage: quality
  needs: [install]
  script:
    - npm run lint

typecheck:
  stage: quality
  needs: [install]
  script:
    - npm run typecheck

unit-tests:
  stage: test
  needs: [install]
  script:
    - npm run test

integration-tests:
  stage: test
  needs: [install]
  # Allowed to fail until real integration tests exist AND the project-level
  # CI_MSSQL_SA_PASSWORD variable is configured. The infrastructure package has
  # no *.integration.spec.ts yet, so this gate is informational in Phase 1.
  allow_failure: true
  services:
    - name: mcr.microsoft.com/mssql/server:2022-latest
      alias: sqlserver
    - name: redis:7
      alias: redis-cache
  variables:
    ACCEPT_EULA: "Y"
    # Required masked CI variable. No fallback: secrets are never committed
    # (COMPLIANCE.md). If unset, the mssql service fails to start and this
    # allow_failure job is skipped/red without leaking a credential.
    MSSQL_SA_PASSWORD: "$CI_MSSQL_SA_PASSWORD"
    DB_HOST: sqlserver
    REDIS_URL: redis://redis-cache:6379
  script:
    # Seed a disposable DB (baseline migration), run integration tests, tear down.
    # No shared mutable state between runs.
    - npm run test:integration

# Security gates. Uses GitLab-managed templates; runs as required gates.
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

sast:
  stage: security

dependency_scanning:
  stage: security

secret_detection:
  stage: security
