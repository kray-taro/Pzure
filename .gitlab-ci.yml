# Pzure CI - DevSecOps foundation (#13)
#
# Design goals (Designing Data-Intensive Applications - Reliability,
# Scalability, Maintainability):
# - Reliability: every correctness invariant is a required, automated gate; a
#   red pipeline blocks merge. No invariant relies on human/agent discipline.
# - Maintainability: stages are small, single-responsibility and cacheable;
#   failures point at one cause.
# - Scalability: jobs are independent and run in parallel; the matrix grows by
#   adding packages, not by rewriting the pipeline.
#
# SOLID/DRY: tokens.json is the single source of truth (DRY). The drift test
# enforces it. The raw-hex guard enforces Dependency Inversion: components
# depend on the semantic token abstraction, never on primitive hex.

stages:
  - guard
  - lint
  - typecheck
  - test
  - integration

default:
  image: node:20-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - corepack enable || true
    - if [ -f package-lock.json ]; then npm ci --cache .npm --prefer-offline || npm install; else npm install; fi

# --- guard stage: cheap, fast-failing policy checks ---------------------------

branch-name:
  stage: guard
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
  before_script: []
  image: alpine:3.20
  script:
    - apk add --no-cache bash >/dev/null
    - bash scripts/check-branch-name.sh "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"

no-raw-hex:
  stage: guard
  before_script: []
  image: alpine:3.20
  script:
    - apk add --no-cache bash grep >/dev/null
    - bash scripts/check-no-raw-hex.sh

secret-detection:
  stage: guard
  before_script: []
  image: alpine:3.20
  script:
    - apk add --no-cache bash grep >/dev/null
    - bash scripts/check-no-secrets.sh

# Tenancy migration guard (ADR-001 §6.4 test 7). Cheap, no DB: fails if any
# Unified_ERD.md transactional table is unclassified or a scope chain is broken,
# and (once migrations exist) if a transactional table has no RLS policy.
tenancy-scoping:
  stage: guard
  before_script: []
  image: node:20-alpine
  script:
    - node scripts/check-tenancy-scoping.mjs

# --- lint / typecheck / test -------------------------------------------------

lint:
  stage: lint
  script:
    - npm run lint

typecheck:
  stage: typecheck
  script:
    - npm run typecheck

test:
  stage: test
  script:
    - npm test
  coverage: '/All files[^|]*\|[^|]*\s+([\d.]+)/'

# Live RLS isolation tests (ADR-001 §6.4 T1–T7) against a real SQL Server,
# provided as a GitLab service (no hand-rolled dind). The in-test connect()
# retries with backoff, so readiness is handled in one place.
#
# Fail-closed where it matters, mergeable where it can't: on develop/protected
# branches the secret MUST be present and the gate runs (a missing secret is a
# hard failure). On feature-branch MRs — where protected variables are not
# exposed — the job is skipped EXPLICITLY (logged, never a silent green); the
# guarantee is upheld when the change reaches develop.
.integration-tenancy-base:
  stage: integration
  image: node:20
  services:
    - name: mcr.microsoft.com/mssql/server:2022-latest
      alias: mssql
  variables:
    ACCEPT_EULA: "Y"
    MSSQL_SA_PASSWORD: "$CI_MSSQL_SA_PASSWORD"
    DB_HOST: "mssql"
  script:
    - npx vitest run tests/tenancy/rls-isolation.test.ts --passWithNoTests=false --reporter=verbose

# Enforced gate on develop and protected branches: secret is required.
integration-tenancy:
  extends: .integration-tenancy-base
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
  before_script:
    - 'test -n "$CI_MSSQL_SA_PASSWORD" || { echo "CI_MSSQL_SA_PASSWORD not set on a protected ref; tenancy isolation cannot be verified"; exit 1; }'

# Best-effort run on feature MRs: runs when the secret happens to be available,
# otherwise skips explicitly (the migration guard + unit tests still gate the MR).
integration-tenancy-mr:
  extends: .integration-tenancy-base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MSSQL_SA_PASSWORD'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
  before_script:
    - 'test -n "$CI_MSSQL_SA_PASSWORD" || { echo "[tenancy] SKIPPING live RLS suite on this MR: CI_MSSQL_SA_PASSWORD is not exposed to unprotected refs. Enforced on develop."; exit 0; }'
