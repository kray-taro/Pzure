# Pzure CI - unified pipeline (reconciles !1 scaffold with develop !7/#13).
#
# Single source of truth: one pipeline preserves every correctness invariant
# from both predecessors with no duplicated job (DRY). Design goals follow DDIA
# (Reliability/Scalability/Maintainability):
#   - Reliability: each invariant is a required, automated gate; red blocks merge.
#   - Maintainability: small, single-responsibility, cacheable stages.
#   - Scalability: jobs are independent; the matrix grows by adding Nx projects,
#     not by rewriting the pipeline.
#
# No secrets in code (COMPLIANCE.md); configuration is environment-based.
# Nothing here deploys to or targets main.

# Run one pipeline per change: a merge-request pipeline when an MR is open,
# otherwise a branch pipeline.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - guard
  - quality
  - test
  - security

variables:
  # Ephemeral runners gain nothing from the Nx daemon or a cross-machine local
  # cache; the latter makes Nx fail with "Invalid Cache Directory".
  NX_DAEMON: "false"

default:
  image: node:20
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    # Interim: fall back to `npm install` until package-lock.json is committed,
    # at which point `npm ci` becomes the reproducible default.
    - if [ -f package-lock.json ]; then npm ci --cache .npm --prefer-offline || npm install; else npm install; fi

# --- guard: cheap, fast-failing policy checks (from develop !7) ---------------

branch-name:
  stage: guard
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
  before_script: []
  image: alpine:3.20
  script:
    - apk add --no-cache bash >/dev/null
    - bash scripts/check-branch-name.sh "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"

no-raw-hex:
  stage: guard
  before_script: []
  image: alpine:3.20
  script:
    - apk add --no-cache bash grep >/dev/null
    - bash scripts/check-no-raw-hex.sh

secret-guard:
  stage: guard
  before_script: []
  image: alpine:3.20
  script:
    - apk add --no-cache bash grep >/dev/null
    - bash scripts/check-no-secrets.sh

# --- quality: lint + typecheck across all Nx projects ------------------------

lint:
  stage: quality
  script:
    - npm run lint

typecheck:
  stage: quality
  script:
    - npm run typecheck

# --- test: unit (required) + integration (informational until specs exist) ---

unit-tests:
  stage: test
  script:
    - npm test
  coverage: '/All files[^|]*\|[^|]*\s+([\d.]+)/'

integration-tests:
  stage: test
  # Allowed to fail until real integration tests exist AND the project-level
  # CI_MSSQL_SA_PASSWORD variable is configured. No *.integration.spec.ts yet,
  # so this gate is informational in Phase 1.
  allow_failure: true
  services:
    - name: mcr.microsoft.com/mssql/server:2022-latest
      alias: sqlserver
    - name: redis:7
      alias: redis-cache
  variables:
    ACCEPT_EULA: "Y"
    # Required masked CI variable. No fallback: secrets are never committed
    # (COMPLIANCE.md). If unset, the mssql service fails to start and this
    # allow_failure job is skipped/red without leaking a credential.
    MSSQL_SA_PASSWORD: "$CI_MSSQL_SA_PASSWORD"
    DB_HOST: sqlserver
    REDIS_URL: redis://redis-cache:6379
  script:
    - npm run test:integration

# --- security: GitLab-managed scanners as required gates ----------------------

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

sast:
  stage: security

dependency_scanning:
  stage: security

secret_detection:
  stage: security
